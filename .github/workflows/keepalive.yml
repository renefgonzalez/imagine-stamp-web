name: Keepalive Supabase

on:
  schedule:
    - cron: '0 */6 * * *'       # cada 6 horas
  workflow_dispatch:              # también manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            || echo "(ignorado: Supabase puede estar pausado, el ping igual cuenta)"
